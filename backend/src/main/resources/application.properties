spring.application.name=backend
server.port=8000

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET:your-256-jwt-secret}
app.jwt.access-expiration-ms=${ACCESS_TOKEN_EXPIRY:900000}
app.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRY:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ImageKit
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/your-imagekit-id}